<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fortuner Audio Bench</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #111417; --panel: #1a1f24; --line: #2a3138; --text: #d8dee4; --muted: #8a96a3;
      --accent: #e0a040; --on: #3fae6a; --off: #b8473f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
    main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px; padding: 16px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    button, select, input[type=text] {
      background: #242b32; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.on { background: var(--on); border-color: var(--on); color: #fff; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
    .row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; margin: 4px 0; }
    .row label { color: var(--muted); }
    .row output { text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    canvas { width: 100%; height: 180px; background: #0b0d0f; border-radius: 6px; display: block; }
    #status { font-variant-numeric: tabular-nums; color: var(--muted); white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; margin-top: 8px; }
    details { border-top: 1px solid var(--line); padding: 6px 0; }
    details summary { cursor: pointer; color: var(--accent); }
    .tuning .row { grid-template-columns: 180px 1fr 60px; }
    .hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Fortuner 2.8 1GD-FTV — audio bench</h1>
    <button id="startBtn" class="primary">Start audio</button>
    <button id="ignBtn">Ignition OFF</button>
    <button id="camBtn">Camera: exterior</button>
    <select id="modeSel" title="Audio mode">
      <option value="hybrid">hybrid</option>
      <option value="synth">synth</option>
      <option value="samples">samples</option>
    </select>
    <button id="sweepBtn">Rev sweep</button>
    <button id="driveBtn">Auto drive 0-100</button>
    <button id="stopAutoBtn">Stop auto</button>
    <button id="muteBtn">Mute</button>
  </header>
  <main>
    <div>
      <section>
        <h2>Vehicle state</h2>
        <div id="sliders"></div>
        <div class="row"><label for="surfaceSel">surface</label>
          <select id="surfaceSel">
            <option>asphalt</option><option>concrete</option><option>broken</option><option>gravel</option>
            <option>mud</option><option>sand</option><option>wet</option><option>rumble</option>
          </select><span></span></div>
        <div class="row"><label for="driveSel">drive mode</label>
          <select id="driveSel"><option>2H</option><option>4H</option><option>4L</option></select><span></span></div>
        <div class="row"><label for="absChk">ABS active</label><input type="checkbox" id="absChk" /><span></span></div>
        <div class="btns">
          <button id="thumpBtn">Suspension thump</button>
          <button id="bumpStopBtn">Bump stop</button>
          <button id="potholeBtn">Pothole (4 wheels)</button>
        </div>
      </section>
      <section style="margin-top:16px">
        <h2>Recorded loops</h2>
        <div class="btns">
          <input type="text" id="manifestUrl" value="/audio/engine/manifest.json" style="flex:1;min-width:180px" />
          <button id="loadBtn">Load</button>
        </div>
        <div class="hint" id="sampleStatus">No loops loaded — synth only. See public/audio/engine/README.md.</div>
      </section>
    </div>
    <div>
      <section>
        <h2>Output spectrum (log f, 20 Hz – 16 kHz)</h2>
        <canvas id="spec" width="1200" height="360"></canvas>
        <div id="status">press "Start audio"</div>
      </section>
      <section style="margin-top:16px" class="tuning">
        <h2>Tuning</h2>
        <div class="btns">
          <button id="dumpBtn">Copy tuning JSON</button>
          <button id="resetBtn">Reset tuning</button>
        </div>
        <div id="tuning"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/audio/audioTestPage.ts"></script>
</body>
</html>
